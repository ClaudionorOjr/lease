name: Run Tests

on:
  push:
    branches:
      - main
      - alpha

defaults:
  run:
    working-directory: apps/server

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      
      - name: Debug workflow run
        run : |
          echo "Workflow: ${{ github.workflow }}"
          echo "Workflow Run Job: ${{ github.job }}"
          echo "Workflow Run Ref: ${{ github.ref }}"
      
      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  e2e-tests:
    name: E2E Tests
    needs: unit-tests
    if: ${{ needs.unit-tests.result == 'success' }}
    runs-on: ubuntu-latest

    services:
      database:
        image: bitnami/postgresql:latest
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          options: >-
            --health-cmd "pg_isready -U $POSTGRES_USER"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 3
            
    env:
      DATABASE_URL: 'postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}'
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      ADMIN_FULLNAME: ${{ secrets.ADMIN_FULLNAME }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      
      - name: Debug workflow run
        run : |
          echo "Workflow: ${{ github.workflow }}"
          echo "Workflow Run Job: ${{ github.job }}"
          echo "Workflow Run Ref: ${{ github.ref }}"
          echo "DATABASE_URL=$DATABASE_URL"
      
      - name: Install dependencies
        run: npm ci

      - name: Wait for DB readiness
        run: |
          echo "Aguardando banco de dados ficar pronto..."
          for i in {1..10}; do
            pg_isready -h localhost -U ${{ secrets.POSTGRES_USER }} && break
            echo "Ainda não está pronto, tentando novamente..."
            sleep 2
          done

      - name: Run e2e tests
        run: npm run test:e2e
